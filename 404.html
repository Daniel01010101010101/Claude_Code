<style>

  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c1020; --surface: #141a2e; --ink: #e5e9f4; --muted: #9aa3bb; --line: #283055; --accent: #8da2ff; --accent-ink: #0c1020; --term-bg: #080b16; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 17px/1.6 "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  main { max-width: 560px; display: grid; gap: 18px; }
  h1 { font: 800 clamp(2rem, 7vw, 3rem)/1.05 "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; margin: 0; text-wrap: balance; }
  p { margin: 0; color: var(--muted); }
  pre { margin: 0; background: var(--term-bg); color: var(--term-ink); border-radius: 12px; padding: 16px 18px;
    font: 0.88rem/1.6 "JetBrains Mono", ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .c { color: var(--term-dim); } .r { color: var(--term-red); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn { font-weight: 600; text-decoration: none; padding: 11px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  a.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
